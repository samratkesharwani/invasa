<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taking Data Out</title>
</head>
<body>
    <button onclick="getData()">
        Get Data
    </button>
    <script>
        const nifty = 'NIFTY'
        const getData = () => {
            fetch(`https://www.nseindia.com/api/option-chain-indices?symbol=${nifty}`)
                .then(response => response.json())
                .then(data => {
                    console.log(data);
                })
                .catch(err => console.log(err));
        }
        const ce = document.getElementById("#equityOptionChainTotalRow-CE-totVol").value
        const pe = document.getElementById("#equityOptionChainTotalRow-PE-totVol").value
        console.log(ce/pe)
    </script>
</body>
</html>
